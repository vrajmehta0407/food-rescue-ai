[project]
name = "foodrescue-ai-backend"
version = "1.0.0"
description = "Predictive food surplus detection and intelligent redistribution platform"
authors = [{ name = "FoodRescue AI Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "pyjwt>=2.8.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

